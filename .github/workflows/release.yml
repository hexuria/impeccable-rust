name: release

# A `v*` tag builds the CLI for every target, attaches the archives to a GitHub release,
# and publishes the crate. A pull request that touches the CLI builds the same archives
# and publishes nothing, so a broken release build is found before the tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - skill/cli/**
      - .github/workflows/release.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: skill/cli

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag matches the crate version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match crate version $version"
            exit 1
          fi
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "impeccable $TAG" --generate-notes

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Add the target
        run: rustup target add "$TARGET"
      - name: Test
        run: cargo test --locked --offline
      - name: Build
        run: cargo build --release --locked --offline --target "$TARGET"
      - name: Archive
        id: archive
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="impeccable-$TARGET-v$version"
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          cd "target/$TARGET/release"
          case "$TARGET" in
            *windows*) archive="$name.zip"; 7z a -tzip "$out/$archive" impeccable.exe >/dev/null ;;
            *)         archive="$name.tar.gz"; tar -czf "$out/$archive" impeccable ;;
          esac
          cd "$out"
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"
          else shasum -a 256 "$archive" > "$archive.sha256"; fi
          cat "$archive.sha256"
          echo "path=$out/$archive" >> "$GITHUB_OUTPUT"
      - name: Attest the archive
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}
      - name: Upload to the draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256"

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # crates.io trusted publishing: no stored token. It works once the crate exists and
      # lists this workflow as a trusted publisher; set the repository variable
      # CRATES_IO_TRUSTED_PUBLISHING to `true` after that.
      - name: Authenticate with crates.io
        id: crates-io
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crate
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo publish --locked
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
